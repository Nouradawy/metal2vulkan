[package]
name = "metal2vulkan-validation"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "LGPL-3.0-or-later"
authors = ["Anees Iqbal <hello@aneesiqbal.ai>"]
description = "Authored-case validation tools for metal2vulkan"
# Never publish this workspace member to crates.io (oracle/executor + private corpus).
publish = false
autobins = false
readme = "README.md"
# Belt-and-suspenders if someone packages this crate locally: keep private harvest out.
exclude = [
    "corpus/local/",
    "corpus/local/**",
    "tests/fixtures/",
    "target/",
    "**/*.air",
    "**/*.metallib",
    "**/*.mtlb",
    "**/*.spv",
    "**/*.spvasm",
]

[dependencies]
metal2vulkan = { path = ".." }
base64 = "0.22"
libc = "0.2"
memchr = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wait-timeout = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"
ash = { version = "0.38", default-features = false, features = ["loaded"] }

[target.'cfg(target_os = "linux")'.dependencies]
ash = { version = "0.38", default-features = false, features = ["loaded"] }

[build-dependencies]
sha2 = "0.10"

[[bin]]
name = "corpus-harvest"
path = "src/bin/corpus-harvest.rs"

[[bin]]
name = "corpus-index"
path = "src/bin/corpus-index.rs"

[[bin]]
name = "corpus-normalize"
path = "src/bin/corpus-normalize.rs"

[[bin]]
name = "corpus-next"
path = "src/bin/corpus-next.rs"

[[bin]]
name = "corpus-case-check"
path = "src/bin/corpus-case-check.rs"

[[bin]]
name = "corpus-status"
path = "src/bin/corpus-status.rs"

[[bin]]
name = "corpus-ab"
path = "src/bin/corpus-ab.rs"

[[bin]]
name = "corpus-metal"
path = "src/bin/corpus-metal.rs"

[[bin]]
name = "corpus-moltenvk"
path = "src/bin/corpus-moltenvk.rs"

[[bin]]
name = "corpus-vulkan"
path = "src/bin/corpus-vulkan.rs"

[[bin]]
name = "corpus-openrouter-propose"
path = "src/bin/corpus-openrouter-propose.rs"

[[bin]]
name = "corpus-triage"
path = "src/bin/corpus-triage.rs"

[[bin]]
name = "corpus-refresh"
path = "src/bin/corpus-refresh.rs"
